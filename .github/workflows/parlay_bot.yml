name: Parlay Bot

on:
  schedule:
    # 6:00 AM Colombia = 11:00 UTC
    - cron: '0 11 * * *'
    # 11:30 PM Colombia = 04:30 UTC (del día siguiente)
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot (auto-detect mañana/noche)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPORTSDB_API_KEY: ${{ secrets.SPORTSDB_API_KEY }}
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "11" ]; then
            echo "🌅 Modo mañana (6 AM COL): Generando parlay..."
            python src/main.py
          else
            echo "🌙 Modo noche (11:30 PM COL): Verificando resultados..."
            python src/results_checker.py
          fi
